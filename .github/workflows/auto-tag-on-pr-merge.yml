name: Sync Dist and Release

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: auto-tag-main
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine release version
        id: versioning
        run: |
          set -euo pipefail

          git fetch --tags --force
          git fetch origin main --force
          git checkout main
          git reset --hard origin/main

          existing_line="$(git tag --points-at HEAD | awk 'match($0,/^[0-9]+\.[0-9]+(\.[0-9]+)?$/){ver=$0;n=split(ver,a,/\./);if(n==2){ver=ver".0"};print ver" "$0}' | sort -V | tail -n1 || true)"
          if [[ -n "${existing_line}" ]]; then
            existing_tag="${existing_line#* }"
            existing_version="${existing_line%% *}"
            echo "version=${existing_version}" >> "${GITHUB_OUTPUT}"
            echo "tag=${existing_tag}" >> "${GITHUB_OUTPUT}"
            echo "should_bump=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          latest_line="$(git tag -l | awk 'match($0,/^[0-9]+\.[0-9]+(\.[0-9]+)?$/){ver=$0;n=split(ver,a,/\./);if(n==2){ver=ver".0"};print ver" "$0}' | sort -V | tail -n1 || true)"

          if [[ -n "${latest_line}" ]]; then
            latest_version="${latest_line%% *}"
          else
            latest_version="0.0.0"
          fi

          IFS='.' read -r major minor patch <<< "${latest_version}"
          next_patch=$((patch + 1))
          next_version="${major}.${minor}.${next_patch}"

          echo "version=${next_version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${next_version}" >> "${GITHUB_OUTPUT}"
          echo "should_bump=true" >> "${GITHUB_OUTPUT}"

      - name: Update package.json version
        if: steps.versioning.outputs.should_bump == 'true'
        env:
          RELEASE_VERSION: ${{ steps.versioning.outputs.version }}
        run: |
          set -euo pipefail

          node -e "const fs=require('fs'); const path='package.json'; const pkg=JSON.parse(fs.readFileSync(path,'utf8')); pkg.version=process.env.RELEASE_VERSION; fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');"

      - name: Build dist assets
        run: pnpm build

      - name: Validate signing secrets
        env:
          TAG_SIGNING_GPG_PRIVATE_KEY: ${{ secrets.TAG_SIGNING_GPG_PRIVATE_KEY }}
          TAG_SIGNING_GPG_PASSPHRASE: ${{ secrets.TAG_SIGNING_GPG_PASSPHRASE }}
          TAG_SIGNING_PASSPHRASE_REQUIRED: ${{ vars.TAG_SIGNING_PASSPHRASE_REQUIRED }}
          TAG_SIGNING_NAME: ${{ secrets.TAG_SIGNING_NAME }}
          TAG_SIGNING_EMAIL: ${{ secrets.TAG_SIGNING_EMAIL }}
        run: |
          set -euo pipefail

          if [[ -z "${TAG_SIGNING_GPG_PRIVATE_KEY:-}" ]]; then
            echo "Missing secret: TAG_SIGNING_GPG_PRIVATE_KEY"
            exit 1
          fi

          if [[ -z "${TAG_SIGNING_NAME:-}" ]]; then
            echo "Missing secret: TAG_SIGNING_NAME"
            exit 1
          fi

          if [[ -z "${TAG_SIGNING_EMAIL:-}" ]]; then
            echo "Missing secret: TAG_SIGNING_EMAIL"
            exit 1
          fi

          passphrase_required="${TAG_SIGNING_PASSPHRASE_REQUIRED:-false}"
          passphrase_required="$(echo "${passphrase_required}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${passphrase_required}" == "1" || "${passphrase_required}" == "true" || "${passphrase_required}" == "yes" ]]; then
            if [[ -z "${TAG_SIGNING_GPG_PASSPHRASE:-}" ]]; then
              echo "Missing secret: TAG_SIGNING_GPG_PASSPHRASE (required because TAG_SIGNING_PASSPHRASE_REQUIRED is enabled)"
              exit 1
            fi
          fi

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7.0.0
        with:
          gpg_private_key: ${{ secrets.TAG_SIGNING_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.TAG_SIGNING_GPG_PASSPHRASE }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true
          git_committer_name: ${{ secrets.TAG_SIGNING_NAME }}
          git_committer_email: ${{ secrets.TAG_SIGNING_EMAIL }}

      - name: Commit version and dist changes if needed
        env:
          TAG_SIGNING_NAME: ${{ secrets.TAG_SIGNING_NAME }}
          TAG_SIGNING_EMAIL: ${{ secrets.TAG_SIGNING_EMAIL }}
          RELEASE_VERSION: ${{ steps.versioning.outputs.version }}
        run: |
          set -euo pipefail

          git add package.json
          git add -fA dist

          if git diff --cached --quiet; then
            echo "dist is up to date"
            exit 0
          fi

          git config user.name "${TAG_SIGNING_NAME}"
          git config user.email "${TAG_SIGNING_EMAIL}"

          git commit -S -m "build: release ${RELEASE_VERSION}"
          git push origin HEAD:main

      - name: Create or reuse release tag
        id: tagging
        env:
          TAG_SIGNING_NAME: ${{ secrets.TAG_SIGNING_NAME }}
          TAG_SIGNING_EMAIL: ${{ secrets.TAG_SIGNING_EMAIL }}
          RELEASE_TAG: ${{ steps.versioning.outputs.tag }}
        run: |
          set -euo pipefail

          git fetch --tags --force
          git fetch origin main --force
          git checkout main
          git reset --hard origin/main

          target_sha="$(git rev-parse HEAD)"
          tag_name="${RELEASE_TAG}"

          if git rev-parse "${tag_name}" >/dev/null 2>&1; then
            echo "tag=${tag_name}" >> "${GITHUB_OUTPUT}"
            echo "tag_created=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git config user.name "${TAG_SIGNING_NAME}"
          git config user.email "${TAG_SIGNING_EMAIL}"

          git tag -s "${tag_name}" "${target_sha}" -m "${tag_name}"
          git push origin "${tag_name}"

          echo "tag=${tag_name}" >> "${GITHUB_OUTPUT}"
          echo "tag_created=true" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release (if missing)
        if: steps.tagging.outputs.tag != ''
        uses: actions/github-script@v8
        env:
          TAG_NAME: ${{ steps.tagging.outputs.tag }}
        with:
          script: |
            const tag = process.env.TAG_NAME;
            const { owner, repo } = context.repo;

            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.info(`Release for ${tag} already exists. Skipping.`);
            } catch (error) {
              if (error.status !== 404) throw error;

              await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: tag,
                generate_release_notes: true
              });
            }
