name: Tag and Release on PR Merge

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: auto-tag-main
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main (with tags)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true

      - name: Read release version from package.json
        id: versioning
        run: |
          set -euo pipefail

          git fetch --tags --force
          git fetch origin main --force
          git checkout main
          git reset --hard origin/main

          release_version="$(node -p "require('./package.json').version")"

          if [[ ! "${release_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json version must be in x.y.z format: ${release_version}"
            exit 1
          fi

          echo "version=${release_version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${release_version}" >> "${GITHUB_OUTPUT}"

      - name: Validate signing secrets
        env:
          TAG_SIGNING_GPG_PRIVATE_KEY: ${{ secrets.TAG_SIGNING_GPG_PRIVATE_KEY }}
          TAG_SIGNING_GPG_PASSPHRASE: ${{ secrets.TAG_SIGNING_GPG_PASSPHRASE }}
          TAG_SIGNING_PASSPHRASE_REQUIRED: ${{ vars.TAG_SIGNING_PASSPHRASE_REQUIRED }}
          TAG_SIGNING_NAME: ${{ secrets.TAG_SIGNING_NAME }}
          TAG_SIGNING_EMAIL: ${{ secrets.TAG_SIGNING_EMAIL }}
        run: |
          set -euo pipefail

          if [[ -z "${TAG_SIGNING_GPG_PRIVATE_KEY:-}" ]]; then
            echo "Missing secret: TAG_SIGNING_GPG_PRIVATE_KEY"
            exit 1
          fi

          if [[ -z "${TAG_SIGNING_NAME:-}" ]]; then
            echo "Missing secret: TAG_SIGNING_NAME"
            exit 1
          fi

          if [[ -z "${TAG_SIGNING_EMAIL:-}" ]]; then
            echo "Missing secret: TAG_SIGNING_EMAIL"
            exit 1
          fi

          passphrase_required="${TAG_SIGNING_PASSPHRASE_REQUIRED:-false}"
          passphrase_required="$(echo "${passphrase_required}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${passphrase_required}" == "1" || "${passphrase_required}" == "true" || "${passphrase_required}" == "yes" ]]; then
            if [[ -z "${TAG_SIGNING_GPG_PASSPHRASE:-}" ]]; then
              echo "Missing secret: TAG_SIGNING_GPG_PASSPHRASE (required because TAG_SIGNING_PASSPHRASE_REQUIRED is enabled)"
              exit 1
            fi
          fi

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7.0.0
        with:
          gpg_private_key: ${{ secrets.TAG_SIGNING_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.TAG_SIGNING_GPG_PASSPHRASE }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true
          git_committer_name: ${{ secrets.TAG_SIGNING_NAME }}
          git_committer_email: ${{ secrets.TAG_SIGNING_EMAIL }}

      - name: Create or reuse release tag
        id: tagging
        env:
          TAG_SIGNING_NAME: ${{ secrets.TAG_SIGNING_NAME }}
          TAG_SIGNING_EMAIL: ${{ secrets.TAG_SIGNING_EMAIL }}
          RELEASE_TAG: ${{ steps.versioning.outputs.tag }}
        run: |
          set -euo pipefail

          git fetch --tags --force
          git fetch origin main --force
          git checkout main
          git reset --hard origin/main

          target_sha="$(git rev-parse HEAD)"
          tag_name="${RELEASE_TAG}"

          if git rev-parse "${tag_name}" >/dev/null 2>&1; then
            echo "tag=${tag_name}" >> "${GITHUB_OUTPUT}"
            echo "tag_created=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git config user.name "${TAG_SIGNING_NAME}"
          git config user.email "${TAG_SIGNING_EMAIL}"

          git tag -s "${tag_name}" "${target_sha}" -m "${tag_name}"
          git push origin "${tag_name}"

          echo "tag=${tag_name}" >> "${GITHUB_OUTPUT}"
          echo "tag_created=true" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release (if missing)
        if: steps.tagging.outputs.tag != ''
        uses: actions/github-script@v8
        env:
          TAG_NAME: ${{ steps.tagging.outputs.tag }}
        with:
          script: |
            const tag = process.env.TAG_NAME;
            const { owner, repo } = context.repo;

            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.info(`Release for ${tag} already exists. Skipping.`);
            } catch (error) {
              if (error.status !== 404) throw error;

              await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: tag,
                generate_release_notes: true
              });
            }
