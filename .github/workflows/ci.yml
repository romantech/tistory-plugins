name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.2.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome
        id: biome
        continue-on-error: true
        run: pnpm check

      - name: Run typecheck
        id: typecheck
        continue-on-error: true
        run: pnpm typecheck

      - name: Build dist assets
        id: build
        continue-on-error: true
        run: pnpm build

      - name: Run tests
        id: test
        continue-on-error: true
        run: pnpm test

      - name: Collect PR summary data
        if: always() && github.event_name == 'pull_request'
        id: summary
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/pr-summary.mjs

      - name: Update PR sticky comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: ci-summary
          message: |
            ## CI summary
            | Check | Status |
            |-------|--------|
            | Biome | ${{ steps.biome.outcome == 'success' && '✅ passed' || steps.biome.outcome == 'skipped' && '⏭️ skipped' || '❌ failed' }} |
            | Typecheck | ${{ steps.typecheck.outcome == 'success' && '✅ passed' || steps.typecheck.outcome == 'skipped' && '⏭️ skipped' || '❌ failed' }} |
            | Build | ${{ steps.build.outcome == 'success' && '✅ passed' || steps.build.outcome == 'skipped' && '⏭️ skipped' || '❌ failed' }} |
            | Tests | ${{ steps.test.outcome == 'success' && '✅ passed' || steps.test.outcome == 'skipped' && '⏭️ skipped' || '❌ failed' }} |

            ## Changed plugins
            ${{ steps.summary.outputs.plugins }}

            ## Dist impact
            ${{ steps.summary.outputs.dist }}

      - name: Fail if any check failed
        if: |
          always() && (
            steps.biome.outcome == 'failure' ||
            steps.typecheck.outcome == 'failure' ||
            steps.build.outcome == 'failure' ||
            steps.test.outcome == 'failure'
          )
        run: |
          echo "❌ One or more checks failed:"
          echo "  biome=${{ steps.biome.outcome }}"
          echo "  typecheck=${{ steps.typecheck.outcome }}"
          echo "  build=${{ steps.build.outcome }}"
          echo "  test=${{ steps.test.outcome }}"
          exit 1
